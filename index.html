 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas</title>
    <style>
        body {
            background-color: #ffe6eb;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h2 {
            font-size: 1.2rem;
            color: #333;
        }
        p {
            color: #555;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .tree-container {
            margin: 20px 0;
            font-size: 3rem;
        }
        .counter {
            font-weight: bold;
            color: #d63384;
            font-size: 0.9rem;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Flores Amarillas para el amor de mi vida:</h2>
        <p>Si pudiera elegir un lugar seguro, sería a tu lado.</p>
        <p>Cuanto más tiempo estoy contigo más te amo.</p>
        
        <div class="tree-container">
            💛🌻🌳
        </div>

        <p style="font-style: italic;">— Te amo</p>

        <div class="counter">
            Mi amor por tu comenzó hace...<br>
            <span id="time">Calculando...</span>
        </div>
    </div>

    <script>
        // Cambia esta fecha por la fecha en la que comenzaron su relación (Año, Mes - 1, Día)
        const fechaInicio = new Date(2025, 8, 21, 0, 0, 0); 

        function actualizarContador() {
            const ahora = new Date();
            const diferencia = ahora - fechaInicio;

            const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
            const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

            document.getElementById("time").innerHTML = 
                `${dias} días ${horas} horas ${minutos} minutos ${segundos} segundos`;
        }

        setInterval(actualizarContador, 1000);
        actualizarContador();
    </script>

</body>
</html>
